[project]
name = "audiblez"
version = "0.5.0+dobrejakcyp"
description = "Generate audiobooks from e-books (epub to wav/m4b)"
authors = [
    { name = "Claudio Santini", email = "hireclaudio@gmail.com" },
    { name = "Lukáš Puška" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"  # current PyTorch needs Python 3.10 or newer
dependencies = [
    "ebooklib (>=0.18,<0.19)",
    "soundfile (>=0.13.1,<0.14.0)",
    "pick (>=2.4.0,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "spacy (>=3.8.3,<4.0.0)",
    "kokoro (>=0.7.9,<0.8.0)",
    "misaki[zh] (>=0.7.10,<0.8.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    # imported directly by this fork's code (before, they only arrived as dependencies of other packages)
    "torch>=2.6",
    "numpy",
    "lxml",
    "huggingface-hub",
    # spaCy language models: sentence splitting (audiblez) and English pronunciation (misaki).
    # Without them, spaCy tries to install them on first use with pip, which uv environments do not have.
    "xx-ent-wiki-sm",
    "en-core-web-sm",
]

[project.optional-dependencies]
# The window (audiblez-ui). Optional because wxPython has no ready-made Linux packages on PyPI.
gui = ["wxpython>=4.2", "pillow"]

[project.urls]
Homepage = "https://claudio.uk/posts/epub-to-audiobook.html"
Documentation = "https://github.com/dobrejakcyp/audiblez"
Repository = "https://github.com/dobrejakcyp/audiblez"
Issues = "https://github.com/dobrejakcyp/audiblez/issues"

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"

[dependency-groups]
dev = ["deptry>=0.23.0"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # the package is audiblez/ at the top of the project, not under src/
source-exclude = ["imgs", "test", "samples", "*.wav", "*.m4b", "cover", "chapters.txt"]

# PyPI only has the CPU build of PyTorch for Windows. On Windows and Linux, PyTorch comes from
# PyTorch's own CUDA 12.8 index instead, so a fresh install keeps using the GPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
xx-ent-wiki-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true  # only packages listed in [tool.uv.sources] come from here; everything else from PyPI
